aid: jakegaylor-com
name: Jake Gaylor
description: 'Jake Gaylor is a software engineer (platform engineering, Kubernetes, developer tooling) whose personal
  site publishes an agent-native representation of his resume. ai.jakegaylor.com serves a hosted Model Context Protocol
  server (Streamable HTTP at /mcp, a legacy SSE transport, and the same server as the npm stdio package @jhgaylor/me-mcp)
  with 12 tools, 6 resources and 7 prompts; an Agent2Agent (A2A) agent published at /.well-known/agent-card.json
  - JWS-signed, served in 0.3 and 1.0 shapes negotiated on the A2A-Version header - with six skills; and an llms.txt.
  Every surface answers anonymously: read the resume and structured screening preferences, assess role fit against
  a job description, generate interview questions, read live intro-call availability and create a pending-confirmation
  booking, or relay a message by email. The server is open source (MIT) at github.com/jhgaylor/ai-jakegaylor-com.'
