  deviations: []
  observations:
  - id: hybrid-shape
    note: The default-served card carries BOTH the 0.3 top-level url/preferredTransport/protocolVersion fields and
      the 1.0 supportedInterfaces[]/signatures[] fields; every hard and optional check passes, so the grade is conformant.
  - id: apex-copy-would-grade-flavored
    note: 'The static copy on jakegaylor.com and the A2A-Version: 1.0 variant carry protocolVersion only inside
      supportedInterfaces[] and no top-level protocolVersion; graded by the 0.3-era top-level rule those two bodies
      would be flavored. The canonical file is the default GET, which is what an unheadered crawler receives.'
  - id: no-securitySchemes
    note: securitySchemes is absent on the 0.3 body and {} on the 1.0 body; both JSON-RPC probes answered anonymously,
      so the omission matches observed behaviour.
  note: Six skills, streaming advertised, notification callbacks not advertised, no extended card. Both protocol
    versions were exercised live on the one endpoint and answered.
