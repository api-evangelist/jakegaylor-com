agent_card:
  name: Jake Gaylor
  description: Agent representing Jake Gaylor, a software engineer (platform engineering, Kubernetes, developer
    tooling). Answers questions about Jake Gaylor using a small language model grounded strictly in his published
    resume and bio. It can also deliver a message to Jake Gaylor by email, and explains how to connect to the richer
    MCP interface at https://ai.jakegaylor.com/mcp.
  version: 1.3.0
  url: https://ai.jakegaylor.com/a2a
  preferred_transport: JSONRPC
  protocol_version: '0.3'
  documentation_url: https://ai.jakegaylor.com
  provider:
    url: https://jakegaylor.com
    organization: Jake Gaylor
  capabilities:
    streaming: true
    pushNotifications: false
  supports_authenticated_extended_card: false
  default_input_modes:
  - text/plain
  default_output_modes:
  - text/markdown
  - text/plain
  supported_interfaces:
  - url: https://ai.jakegaylor.com/a2a
    protocolBinding: JSONRPC
    tenant: ''
    protocolVersion: '1.0'
  - url: https://ai.jakegaylor.com/a2a
    protocolBinding: JSONRPC
    tenant: ''
    protocolVersion: '0.3'
  signed: true
  signature_protected_header_decoded:
    alg: ES256
    kid: jakegaylor-a2a-2026
    typ: JOSE
    jku: https://ai.jakegaylor.com/.well-known/jwks.json
  security_schemes: null
  skills:
  - id: about-jake
    name: About Jake Gaylor
    description: Answers any question about Jake Gaylor's experience, skills, and background, grounded in his resume
      and bio. Falls back to returning the complete resume as markdown if the answer cannot be generated.
    tags:
    - resume
    - hiring
    - background
    - software-engineer
    examples:
    - Tell me about Jake Gaylor's work experience
    - What is Jake Gaylor's background with Kubernetes?
    input_modes:
    - text/plain
    output_modes:
    - text/markdown
  - id: candidate-preferences
    name: Screening & Logistics
    description: 'Structured screening data as JSON: role types, level, location, relocation, remote preference,
      work authorization, compensation stance, availability, and machine-readable resume links (JSON Resume at https://jakegaylor.com/resume.json).
      Ask for "preferences" or "screening data".'
    tags:
    - screening
    - logistics
    - hiring
    - structured-data
    examples:
    - What are Jake Gaylor's preferences and screening logistics?
    input_modes:
    - text/plain
    output_modes:
    - application/json
    - text/markdown
  - id: schedule-intro-call
    name: Schedule an Intro Call
    description: 'Books a 30-minute intro call on Jake Gaylor''s real calendar. Ask about availability to get open
      slots, then send `BOOK: <slot ISO time> | <your email> | <your name> | <optional note>`. Bookings are pending
      until Jake Gaylor confirms; the booker receives the outcome by email. Humans can book directly at the booking
      page returned with the slots.'
    tags:
    - scheduling
    - calendar
    - hiring
    - booking
    examples:
    - What is Jake Gaylor's availability this week?
    - 'BOOK: 2026-08-03T15:00:00.000Z | recruiter@acme.com | Jane Smith | Staff platform role'
    input_modes:
    - text/plain
    output_modes:
    - application/json
    - text/markdown
  - id: assess-role-fit
    name: Assess Role Fit
    description: 'Send a job description (paste it directly or prefix with "JD:") and get an honest fit assessment
      grounded in Jake Gaylor''s resume: a direct verdict, strengths with cited evidence, gaps named plainly, a
      logistics check against his screening data, and suggested interview questions. LLM-backed; if the model is
      unavailable it returns the resume and screening data for the caller to assess directly.'
    tags:
    - hiring
    - role-fit
    - assessment
    - job-description
    examples:
    - 'JD: Staff Platform Engineer at Acme — Kubernetes, AWS, GitOps. Requirements: ...'
    input_modes:
    - text/plain
    output_modes:
    - text/markdown
  - id: connect-via-mcp
    name: Connect via MCP
    description: Returns instructions for connecting to Jake Gaylor's Model Context Protocol server, which exposes
      his resume, links, and contact tools to MCP-capable clients. Triggered by any message mentioning MCP.
    tags:
    - mcp
    - integration
    - model-context-protocol
    examples:
    - How do I connect to Jake Gaylor's MCP server?
    input_modes:
    - text/plain
    output_modes:
    - text/markdown
  - id: contact-jake
    name: Contact Jake Gaylor
    description: Delivers a message to Jake Gaylor by email. Start the message text with "CONTACT:" and include
      the opportunity details plus a reply address so Jake Gaylor can respond.
    tags:
    - contact
    - email
    - hiring
    examples:
    - 'CONTACT: We''re hiring a staff platform engineer at Acme. Reach me at recruiter@acme.com'
    input_modes:
    - text/plain
    output_modes:
    - text/plain
